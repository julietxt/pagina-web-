<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Contacto</title>
        <link rel="stylesheet" href="../assets/css/style.css">
        <script src="https://kit.fontawesome.com/tu-kit.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <!--bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    </head>
    <body>
        <header>
            <div class="container header">
                <div class="row">
                    <div class="col-md-4">
                        <div class= "logo">
                            <a class="navbar-brand" href="index.html">MisViajes.com</a>
                        </div>
                    </div>

                    <nav class="col-8">
                        <ul>
                            <li><a href="../index.html">Inicio</a></li>
                            <li><a href="vuelos.html">Vuelos</a></li>
                            <li><a href="paquetes.html">Paquetes</a></li>
                            <li><a href="testimonios.html">Testimonios</a></li>
                            <li><a href="ayuda.html">Ayuda</a></li>
                            <li><a href="contacto.html" class="active">Contacto</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>

        <main>
            <section class="hero hero-londres">
                <!-- Imagen-->
                <div class="hero-content text-center text-white">
                    <h1 class="titulo-contacto">¿Tenés dudas? ¡Escribinos!</h1>
                </div>
            </section>

            <section class="formulario py-5" style="background-color: #8b5cf6">
                <div class="container">
                    <h2 class="text-white mb-4">Contactanos</h2>
                    <form class="row g-3">
                        <div class="col-md-6">
                            <input type="text" class="form-control" placeholder="Nombre">
                        </div>  
                        <div class="col-md-6">
                            <input type="email" class="form-control" placeholder="Correo electrónico">
                        </div>
                        <div class="col-12">
                            <textarea class="form-control" rows="4" placeholder="Mensaje"></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn w-100" style="background-color: #38b000; color: #2d6a4f;">Enviar</button>
                        </div> 
                    </form>
                </div>    
            </section>
        </main>

        <footer>
            <div class="redes">
                <i class="fa-brands fa-square-instagram"></i>
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-square-youtube"></i>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
